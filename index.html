function cardGlueHtml(x){
  const a=x.a;
  if(!a.gl) return '<div class="sub" style="padding:14px 0">Артикул не в склейке — сравнивать не с чем.</div>';
  const rows=(S.glue[a.mp+"|"+a.gl]||[]).map(art=>artByKey(a.mp,art)).filter(Boolean).map(o=>o===a?x:agg(o,""));
  const st=S.glSort||{k:"op30",d:-1}, col=GL_COLS.find(c=>c[0]===st.k)||GL_COLS[2];
  rows.sort((p,q)=>{ const u=col[2](p), v=col[2](q);
    const nu=(u==null||u==="")?-Infinity:u, nv=(v==null||v==="")?-Infinity:v;
    return (nu<nv?-1:nu>nv?1:0)*st.d; });
  const enough=rows.filter(r=>r.op30>=FX_MIN);
  const best={};
  for(const k of ["op30","k1","k3","o30","os30"]){
    const pool=(k==="k1"||k==="k3")?enough:rows;
    const m=Math.max(-Infinity,...pool.map(r=>r[k]==null?-Infinity:r[k]));
    if(isFinite(m)&&m>0&&pool.length>1) best[k]=m;
  }
  const so=sum(rows,r=>r.op30), sc=sum(rows,r=>r.ca30), sr=sum(rows,r=>r.fo30);
  const gk1=so?sc/so*100:null, gk3=so?sr/so*100:null;
  let h='<div class="sect" style="margin-top:14px">Склейка '+esc(a.gl)+' · '+rows.length+' арт.'+
    demoTag(a.mp==="OZON"?"gl_oz":"gl")+'</div>';
  if(a.mp==="WB"&&x.op30>=FX_MIN&&gk1!=null)
    h+='<div class="fxnote" style="margin-bottom:6px">В среднем по склейке: в корзину <b>'+gk1.toFixed(1)+
      '%</b>, в заказ <b>'+gk3.toFixed(1)+'%</b>. У этого артикула: '+
      sgn(x.k1-gk1,1,' п.п.')+' и '+sgn(x.k3-gk3,1,' п.п.')+'.</div>';
  const cell=(k,v,txt,r)=>{
    const few=(k==="k1"||k==="k3")&&r.op30<FX_MIN;
    const cls=few?"few":(best[k]!=null&&v===best[k]?"best":"");
    return '<td class="'+cls+'"'+(few?' title="меньше '+FX_MIN+' переходов — конверсия ненадёжна"':'')+'>'+txt+'</td>'; };
  h+='<div style="overflow-x:auto"><table class="glt"><tr><th></th><th data-gs="art">Артикул</th>'+
    GL_COLS.map(c=>'<th data-gs="'+c[0]+'" title="'+esc(c[3])+'">'+c[1]+(st.k===c[0]?(st.d>0?' ↑':' ↓'):'')+'</th>').join('')+'</tr>'+
    rows.map(r=>{ const o=r.a, ph=o.pw&&o.pw[0]&&o.pw[0][0];
      const lowSz=r.cnt&&r.full/r.cnt<0.6;
      return '<tr class="'+(o===a?'cur':'')+'">'+
        '<td>'+(ph?'<img loading="lazy" src="'+esc(ph)+'" alt="" onerror="this.removeAttribute(\'src\')">':'<span class="noimg"></span>')+'</td>'+
        '<td><a href="#" class="artlink" data-art="'+esc(o.art)+'" data-mp="'+esc(o.mp)+'">'+esc(o.art)+'</a></td>'+
        '<td>'+num(r.total)+'</td>'+
        '<td'+(lowSz?' style="color:var(--gold)" title="в наличии мало размеров — конверсия в заказ занижена не из‑за контента"':'')+'>'+
          r.full+'/'+r.cnt+'</td>'+
        cell("op30",r.op30,num(r.op30),r)+cell("k1",r.k1,pc1(r.k1),r)+cell("k3",r.k3,pc1(r.k3),r)+
        cell("o30",r.o30,num(r.o30),r)+cell("os30",r.os30,num(r.os30),r)+
        '<td>'+(r.fbN?r.fbR.toFixed(1):'<span class="nt">—</span>')+'</td>'+
        '<td>'+(r.lc?esc(ruDM(r.lc.d)):'<span class="nt">—</span>')+'</td></tr>'; }).join('')+
    '</table></div>'+
    '<div class="fxnote">Зелёным — лучший результат в склейке. Конверсии сравниваются только у артикулов с '+FX_MIN+
    '+ переходами за 30 дней. Жёлтые «размеры» — в наличии меньше 60% ряда: конверсия в заказ страдает от наличия, а не от карточки.</div>';
  return h;
}

/* ================= ПРОДАЖИ: СРАВНЕНИЕ ПЕРИОДОВ, ВЫКУП, РЕКЛАМА =================
   Дневные ряды берутся из a.fn (заказы r, заказы в сотнях ₽ s, реклама ₽ a) —
   у WB из воронки, у OZON из отправлений и рекламы. */
const CMP_P=[[1,"вчера к тому же дню неделю назад"],[7,"7 дней к прошлым 7"],
             [14,"14 дней к прошлым 14"],[30,"30 дней к прошлым 30"]];
const DROP_MIN=5;    // меньше 5 заказов в прошлом периоде — процент изменения не считаем
function cmpP(){ return S.cmpP||7; }
function cmpLab(){ const p=CMP_P.find(q=>q[0]===cmpP()); return p?p[1]:""; }
function perWin(P){
  const N=fnN();
  if(P===1) return {c:[N-1,N-1], p:[N-8,N-8]};           // вчера и тот же день недели
  return {c:[N-P,N-1], p:[N-2*P,N-P-1]};
}
function pctCh(c,p){ return p>0?(c/p-1)*100:null; }
function perAgg(a){
  const w=perWin(cmpP()), r1=v=>v==null?null:Math.round(v*10)/10;
  const pO=fnSum(a,"r",w.c[0],w.c[1]), qO=fnSum(a,"r",w.p[0],w.p[1]);
  const pS=fnSum(a,"s",w.c[0],w.c[1])*100, qS=fnSum(a,"s",w.p[0],w.p[1])*100;
  const pA=fnSum(a,"a",w.c[0],w.c[1]), qA=fnSum(a,"a",w.p[0],w.p[1]);
  return {pO,qO,pS,qS,pA,qA,
    dO:qO>=DROP_MIN?r1(pctCh(pO,qO)):null,
    dS:qO>=DROP_MIN?r1(pctCh(pS,qS)):null,
    dA:qA>0?r1(pctCh(pA,qA)):null};
}
const BP_MIN=10;     // меньше 10 заказов с итоговым статусом — % выкупа не показываем как надёжный
function bpAgg(a){
  const bp=a.bp&&a.bp[1]>=BP_MIN?a.bp[0]/a.bp[1]*100:null;
  const os30=a.sl?a.sl.m[1]:0, sp30=a.ad?a.ad.m[2]:0;
  const osB=bp!=null?os30*bp/100:0;           // ожидаемая выручка от выкупов
  return {bp, bpN:a.bp?a.bp[0]:0, bpD:a.bp?a.bp[1]:0, osB, spB:bp!=null?sp30:0,
    drrB:sp30>0?(osB>0?sp30/osB*100:(bp!=null?Infinity:null)):(bp!=null&&os30>0?0:null),
    adY:a.ad?a.ad.y[2]:0, sp7:a.ad?a.ad.w[2]:0};
}
function stockAll(a){ const m=S.artStockMp[a.mp]; const r=m&&m[a.art]; return r?r.t:0; }

/* ---- простой график: столбики + линия, подписи дней, подсветка окон ---- */
function blChart(o){
  // o: {bars, line, iso(j), barCls, barLab, lineLab, lineFmt, shade:[[j0,j1,cls]]}
  const Wd=600, H=170, top=14, bot=22, ph=H-top-bot, L=40, R=52, pw=Wd-L-R, n=o.bars.length, step=pw/n;
  const mx=Math.max(1,...o.bars), lmx=Math.max(1,...(o.line||[0]))*1.1;
  const X=j=>L+j*step, Y=v=>top+ph-v/mx*ph, YL=v=>top+ph-v/lmx*ph;
  let g='';
  for(const s of (o.shade||[])){ const a=Math.max(0,s[0]), b=Math.min(n-1,s[1]); if(b<a) continue;
    g+='<rect x="'+X(a).toFixed(1)+'" y="'+top+'" width="'+((b-a+1)*step).toFixed(1)+'" height="'+ph+'" class="'+s[2]+'"/>'; }
  o.bars.forEach((v,j)=>{ if(v) g+='<rect x="'+(X(j)+step*.12).toFixed(1)+'" y="'+Y(v).toFixed(1)+'" width="'+
    (step*.76).toFixed(1)+'" height="'+(top+ph-Y(v)).toFixed(1)+'" class="'+(o.barCls||"fxbar")+'"/>'; });
  if(o.line&&o.line.some(v=>v)) g+='<path d="'+o.line.map((v,j)=>(j?'L':'M')+(X(j)+step/2).toFixed(1)+','+YL(v).toFixed(1)).join('')+'" class="fxline"/>';
  g+='<text x="'+(L-5)+'" y="'+(top+9)+'" text-anchor="end" class="fxax">'+num(mx)+'</text>'+
     '<text x="'+(L-5)+'" y="'+(top+ph)+'" text-anchor="end" class="fxax">0</text>';
  if(o.line&&o.line.some(v=>v)) g+='<text x="'+(Wd-R+5)+'" y="'+(top+9)+'" class="fxax fxc">'+(o.lineFmt?o.lineFmt(lmx):Math.round(lmx))+'</text>';
  [0,Math.floor(n/2),n-1].forEach(j=>g+='<text x="'+(X(j)+step/2).toFixed(1)+'" y="'+(H-6)+'" text-anchor="middle" class="fxax">'+ruDM(o.iso(j))+'</text>');
  o.bars.forEach((v,j)=>{ const t=ruDate(o.iso(j))+"\n"+o.barLab+": "+v.toLocaleString("ru-RU")+
      (o.line?"\n"+o.lineLab+": "+Math.round(o.line[j]).toLocaleString("ru-RU"):"");
    g+='<rect x="'+X(j).toFixed(1)+'" y="'+top+'" width="'+step.toFixed(1)+'" height="'+ph+'" fill="transparent"><title>'+esc(t)+'</title></rect>'; });
  return '<svg class="fxsvg" viewBox="0 0 '+Wd+' '+H+'" role="img">'+g+'</svg>';
}

/* ---------- правка характеристик: только в памяти страницы, без сохранения ----------
   S.chEd["МП|артикул"] = {индекс характеристики: новое значение}.
   Исходные данные (DATA) не меняются; перезагрузка страницы всё сбрасывает. */
function chKey(a){ return a.mp+"|"+a.art; }
function chVal(c){ return c[1]==null?"":String(c[1]); }
function chEdits(a){ return (S.chEd||{})[chKey(a)]||{}; }
function chCur(a,c){ const e=chEdits(a); return (c[0] in e)?e[c[0]]:chVal(c); }
function chEdCount(){ let n=0; for(const k in (S.chEd||{})) n+=Object.keys(S.chEd[k]).length; return n; }
function chSummary(a){
  const chs=chOf(a)||[];
  const f=chs.filter(c=>chCur(a,c).trim()!=="").length;
  const r=chs.filter(c=>c[2]&&chCur(a,c).trim()==="").length;
  return {f,t:chs.length,r,e:Object.keys(chEdits(a)).length};
}
function chSumHtml(a){
  const s=chSummary(a), pct=s.t?Math.round(s.f/s.t*100):0;
  return '<div class="sub" style="margin-top:6px">заполнено <b style="color:var(--ink)">'+s.f+'</b> из '+s.t+
    (s.r?' · <span class="nf">обязательных пустых: '+s.r+'</span>':'')+
    (s.e?' · <span style="color:var(--gold)">изменено: '+s.e+'</span>':'')+'</div>'+
    '<div class="pbar"><i style="width:'+pct+'%"></i></div>';
}

  let h='<div class="sect" style="margin-top:14px">Характеристики '+(a.mp==="OZON"?"OZON":"WB")+demoTag(key)+'</div>';
  if(!chs.length) return h+'<div class="sub" style="padding:4px 0">Характеристик нет.</div>';
  const all=chEdCount();
  h+='<div id="ch-sum">'+chSumHtml(a)+'</div>'+

       '<button class="btn" id="ch-reset"'+(Object.keys(chEdits(a)).length?'':' disabled')+'>Сбросить правки артикула</button>'+
       '<button class="btn" id="ch-csv"'+(all?'':' disabled')+'>Изменения CSV'+(all?' ('+all+')':'')+'</button>'+

    .sort((p,q)=>((p[1]==null)-(q[1]==null))||(q[2]||0)-(p[2]||0));
  const e=chEdits(a);
  return h+'<table class="hm" style="border-spacing:0">'+rows.map(c=>{
    const ch=(c[0] in e), v=chCur(a,c);
    return '<tr class="chrow'+(ch?' chd':'')+'" data-ci="'+c[0]+'"><td>'+esc(N[c[0]]||"?")+
      (c[2]?'<span class="req">обяз.</span>':'')+'</td><td>'+
      '<div class="chcell"><input class="chin" type="text" data-ci="'+c[0]+'" value="'+esc(v)+'" placeholder="не заполнено">'+
      '<button class="x chundo" data-ci="'+c[0]+'" title="вернуть исходное"'+(ch?'':' hidden')+'>↺</button></div>'+
      '<div class="chwas"'+(ch?'':' hidden')+'>было: '+(chVal(c)?esc(chVal(c)):'<i>пусто</i>')+'</div></td></tr>';
  }).join('')+'</table>';
}
function bindChars(x){
  const a=x.a, B=$("cbody"), k=chKey(a);
  const orig=ci=>{ const c=(chOf(a)||[]).find(c=>c[0]===ci); return c?chVal(c):""; };
  const refresh=()=>{
    $("ch-sum").innerHTML=chSumHtml(a);
    $("ch-reset").disabled=!Object.keys(chEdits(a)).length;
    const n=chEdCount();
    $("ch-csv").disabled=!n; $("ch-csv").textContent="Изменения CSV"+(n?" ("+n+")":"");
  };
  B.querySelectorAll(".chin").forEach(inp=>{
    const ci=+inp.dataset.ci, tr=inp.closest("tr");
    inp.oninput=()=>{
      S.chEd=S.chEd||{};
      const m=S.chEd[k]||(S.chEd[k]={});
      if(inp.value===orig(ci)) delete m[ci]; else m[ci]=inp.value;
      if(!Object.keys(m).length) delete S.chEd[k];
      const ch=(ci in chEdits(a));
      tr.classList.toggle("chd",ch);
      tr.querySelector(".chundo").hidden=!ch;
      tr.querySelector(".chwas").hidden=!ch;
      refresh();
    };
    inp.onkeydown=ev=>{
      if(ev.key==="Enter"){ ev.preventDefault(); inp.blur(); }
      if(ev.key==="Escape"){ ev.stopPropagation(); inp.value=orig(ci); inp.oninput(); inp.blur(); }
    };
  });
  B.querySelectorAll(".chundo").forEach(b=>b.onclick=()=>{
    const inp=B.querySelector('.chin[data-ci="'+b.dataset.ci+'"]');
    inp.value=orig(+b.dataset.ci); inp.oninput();
  });
  $("ch-reset").onclick=()=>{ if(S.chEd) delete S.chEd[k]; drawCardBody(x); };
  $("ch-csv").onclick=()=>{
    const N=S.data.chn||[], rows=[["Маркетплейс","Артикул","ID","Характеристика","Было","Стало"]];
    for(const kk in (S.chEd||{})){
      const [mp,art]=kk.split("|");
      const o=S.data.articles.find(q=>q.mp===mp&&q.art===art); if(!o) continue;
      for(const ci in S.chEd[kk]){
        const c=(chOf(o)||[]).find(c=>c[0]===+ci);
        rows.push([mp,art,o.id,N[+ci]||"",c?chVal(c):"",S.chEd[kk][ci]]);
      }
    }
    dl(rows,"characteristics_edits");
  };
}

     '<div class="fxnote">% выкупа: '+esc(bpBasis(a))+'. ДРР от заказов = расход / сумма заказов. '+

/* ---------- выгрузка ---------- */
function dl(rows,name){
  const csv=rows.map(r=>r.map(v=>'"'+String(v==null?"":v).replace(/"/g,'""')+'"').join(";")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"}));
  a.download=name+"_"+new Date().toISOString().slice(0,10)+".csv";
  a.click(); URL.revokeObjectURL(a.href);
}

      rows.push([r.o,r.d,a[0],a[1],a[2]||""]);

};

/* Данные лежат в странице gzip+base64 (DATA_GZ) или как есть (DATA_RAW, если
   COMPRESS_DATA=False). Распаковка — встроенным DecompressionStream браузера. */
/* Режим облака: указатель stock_supplies/current говорит, какой снимок свежий
   и из скольких кусков он состоит; куски — сжатый gzip JSON, поле d (bytes).
   Firestore REST отдаёт bytes в base64. Каждое открытие — 1 + N чтений. */
async function loadCloud(){
  const C=DATA_CLOUD;
  const base="https://firestore.googleapis.com/v1/projects/"+encodeURIComponent(C.project)+
             "/databases/(default)/documents/";
  const key=C.apiKey?"?key="+encodeURIComponent(C.apiKey):"";
  const get=async p=>{
    const r=await fetch(base+p+key,{cache:"no-store"});
    if(!r.ok){
      let m=""; try{ m=((await r.json()).error||{}).message||""; }catch(e){}
      throw new Error("Firestore "+r.status+" на «"+p+"»"+(m?": "+m:"")+
        (r.status===403?" — проверь правила чтения Firestore":"")+
        (r.status===404?" — снимка ещё нет, запусти sync_to_cloud.py":""));
    }
    return r.json();
  };
  $("state").textContent="Загружаю данные из облака…";
  const f=(await get(C.root+"/current")).fields||{};
  const snap=f.snap&&f.snap.stringValue, n=+(f.chunks&&f.chunks.integerValue||0);
  if(!snap||!n) throw new Error("в Firestore нет указателя на снимок — запусти sync_to_cloud.py");
  let done=0;
  const parts=await Promise.all(Array.from({length:n},(_,i)=>
    get(C.snaps+"/"+encodeURIComponent(snap)+"/chunks/c"+String(i).padStart(3,"0")).then(d=>{
      done++; $("state").textContent="Загружаю данные из облака… "+done+" из "+n;
      const b=atob(d.fields.d.bytesValue), u=new Uint8Array(b.length);
      for(let k=0;k<b.length;k++) u[k]=b.charCodeAt(k);
      return u; })));
  $("state").textContent="Распаковываю данные…";
  const st=new Blob(parts).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(st).text());
}
async function loadData(){
  if(typeof DATA_CLOUD!=="undefined"){
    if(typeof DecompressionStream==="undefined")
      throw new Error("браузер не умеет распаковывать данные — открой страницу в свежем Chrome, Edge, Firefox или Safari");
    return loadCloud();
  }
  if(typeof DATA_RAW!=="undefined") return DATA_RAW;
  if(typeof DecompressionStream==="undefined")
    throw new Error("браузер не умеет распаковывать данные — открой страницу в свежем Chrome, Edge, Firefox или Safari");
  const bin=atob(DATA_GZ), u=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) u[i]=bin.charCodeAt(i);
  const st=new Blob([u]).stream().pipeThrough(new DecompressionStream("gzip"));
  return JSON.parse(await new Response(st).text());
}
$("state").textContent="Распаковываю данные…";
setTimeout(async()=>{              // дать браузеру показать «Распаковываю…»
  try{ DATA=await loadData(); }
  catch(e){ $("state").textContent="Не удалось прочитать данные: "+e.message; return; }
  init(DATA);
  artInit();
  fltInit();
},0);
</script>
